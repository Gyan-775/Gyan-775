name: Update GitHub Dashboard

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate dashboard SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          USERNAME = "Gyan-775"
          TOKEN = os.environ.get("GITHUB_TOKEN")

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Gyan-775-GitHub-Dashboard"
          }

          def github_get(url):
              request = urllib.request.Request(url, headers=headers)

              with urllib.request.urlopen(request) as response:
                  return json.loads(response.read().decode())

          # -------------------------------------------------
          # USER
          # -------------------------------------------------

          user = github_get(
              f"https://api.github.com/users/{USERNAME}"
          )

          public_repos = user.get("public_repos", 0)

          # -------------------------------------------------
          # REPOSITORIES
          # -------------------------------------------------

          repositories = []

          page = 1

          while True:
              data = github_get(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not data:
                  break

              repositories.extend(data)

              if len(data) < 100:
                  break

              page += 1

          total_stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repositories
          )

          total_forks = sum(
              repo.get("forks_count", 0)
              for repo in repositories
          )

          # -------------------------------------------------
          # LANGUAGES
          # -------------------------------------------------

          language_totals = {}

          for repo in repositories:

              if repo.get("fork"):
                  continue

              languages = github_get(
                  repo["languages_url"]
              )

              for language, amount in languages.items():
                  language_totals[language] = (
                      language_totals.get(language, 0) + amount
                  )

          language_totals = dict(
              sorted(
                  language_totals.items(),
                  key=lambda item: item[1],
                  reverse=True
              )
          )

          total_language_bytes = sum(
              language_totals.values()
          )

          top_languages = []

          if total_language_bytes:
              for language, amount in list(language_totals.items())[:5]:
                  percentage = (
                      amount / total_language_bytes
                  ) * 100

                  top_languages.append(
                      (language, percentage)
                  )

          # -------------------------------------------------
          # TIMESTAMP
          # -------------------------------------------------

          updated_at = datetime.now(
              timezone.utc
          ).strftime("%d %b %Y • %H:%M UTC")

          # -------------------------------------------------
          # SVG HELPERS
          # -------------------------------------------------

          def escape(value):
              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )

          language_colors = {
              "JavaScript": "#F7DF1E",
              "TypeScript": "#3178C6",
              "Java": "#F97316",
              "HTML": "#F97316",
              "CSS": "#38BDF8",
              "Python": "#FACC15",
              "C": "#A5B4FC",
              "C++": "#60A5FA",
              "Shell": "#22C55E",
              "Go": "#22D3EE",
              "PHP": "#A78BFA",
              "Kotlin": "#A855F7",
          }

          # -------------------------------------------------
          # BUILD LANGUAGE BARS
          # -------------------------------------------------

          language_svg = ""

          y = 285

          for language, percentage in top_languages:

              width = max(
                  8,
                  min(
                      360,
                      percentage * 3.6
                  )
              )

              color = language_colors.get(
                  language,
                  "#6366F1"
              )

              language_svg += f"""
              <text
                x="650"
                y="{y}"
                class="mono"
                font-size="14">
                {escape(language)}
              </text>

              <rect
                x="650"
                y="{y + 10}"
                width="360"
                height="10"
                rx="5"
                fill="#111827"/>

              <rect
                x="650"
                y="{y + 10}"
                width="{width}"
                height="10"
                rx="5"
                fill="{color}">

                <animate
                  attributeName="width"
                  from="0"
                  to="{width}"
                  dur="1.2s"
                  fill="freeze"/>

              </rect>

              <text
                x="1030"
                y="{y + 19}"
                class="muted"
                font-size="11">
                {percentage:.1f}%
              </text>
              """

              y += 48

          # -------------------------------------------------
          # SVG
          # -------------------------------------------------

          svg = f"""<svg
          width="1200"
          height="680"
          viewBox="0 0 1200 680"
          fill="none"
          xmlns="http://www.w3.org/2000/svg">

          <defs>

            <linearGradient id="bg"
