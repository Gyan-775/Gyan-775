name: Update GitHub Dashboard

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github.svg"

  schedule:
    # Every 6 hours
  - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate live GitHub dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          USERNAME = "Gyan-775"
          TOKEN = os.environ.get("GITHUB_TOKEN")

          if not TOKEN:
              raise RuntimeError("GITHUB_TOKEN is missing")

          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Gyan-775-GitHub-Dashboard"
          }


          # ============================================================
          # HTTP HELPERS
          # ============================================================

          def github_get(url):
              request = urllib.request.Request(
                  url,
                  headers=HEADERS,
                  method="GET"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))


          def github_graphql(query, variables=None):
              payload = {
                  "query": query,
                  "variables": variables or {}
              }

              body = json.dumps(payload).encode("utf-8")

              request = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=body,
                  headers={
                      **HEADERS,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if "errors" in result:
                  raise RuntimeError(
                      "GitHub GraphQL error: "
                      + json.dumps(result["errors"])
                  )

              return result["data"]


          def escape(value):
              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )


          # ============================================================
          # PROFILE DATA
          # ============================================================

          print("Fetching GitHub profile...")

          user = github_get(
              f"https://api.github.com/users/{USERNAME}"
          )

          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          following = user.get("following", 0)


          # ============================================================
          # REPOSITORIES
          # ============================================================

          print("Fetching repositories...")

          repositories = []
          page = 1

          while True:
              data = github_get(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not data:
                  break

              repositories.extend(data)

              if len(data) < 100:
                  break

              page += 1


          total_stars = sum(
              repo.get("stargazers_count", 0)
              for repo in repositories
              if not repo.get("fork")
          )

          total_forks = sum(
              repo.get("forks_count", 0)
              for repo in repositories
              if not repo.get("fork")
          )


          # ============================================================
          # LANGUAGE DATA
          # ============================================================

          print("Fetching language data...")

          language_totals = {}

          for repo in repositories:

              if repo.get("fork"):
                  continue

              try:
                  languages = github_get(repo["languages_url"])

                  for language, amount in languages.items():
                      language_totals[language] = (
                          language_totals.get(language, 0) + amount
                      )

              except Exception as error:
                  print(
                      f"Could not fetch languages for "
                      f"{repo.get('name')}: {error}"
                  )


          language_totals = dict(
              sorted(
                  language_totals.items(),
                  key=lambda item: item[1],
                  reverse=True
              )
          )

          total_language_bytes = sum(language_totals.values())

          top_languages = []

          if total_language_bytes:
              for language, amount in list(language_totals.items())[:5]:
                  percentage = (
                      amount / total_language_bytes
                  ) * 100

                  top_languages.append(
                      (language, percentage)
                  )


          # ============================================================
          # REAL CONTRIBUTION CALENDAR
          # ============================================================

          print("Fetching real contribution calendar...")

          contribution_query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    firstDay
                    contributionDays {
                      date
                      weekday
                      contributionCount
                      color
                      contributionLevel
                    }
                  }
                }
              }
            }
          }
          """

          contribution_data = github_graphql(
              contribution_query,
              {"login": USERNAME}
          )

          calendar = (
              contribution_data["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total_contributions = calendar["totalContributions"]
          weeks = calendar["weeks"]

          print(
              f"Total contributions: "
              f"{total_contributions}"
          )

          print(
              f"Contribution weeks: "
              f"{len(weeks)}"
          )


          # ============================================================
          # LANGUAGE COLORS
          # ============================================================

          language_colors = {
              "JavaScript": "#F7DF1E",
              "TypeScript": "#3178C6",
              "Java": "#F97316",
              "HTML": "#F97316",
              "CSS": "#38BDF8",
              "Python": "#FACC15",
              "C": "#A5B4FC",
              "C++": "#60A5FA",
              "Shell": "#22C55E",
              "Go": "#22D3EE",
              "PHP": "#A78BFA",
              "Kotlin": "#A855F7",
              "Rust": "#DEA584",
              "Dart": "#00B4AB",
          }


          # ============================================================
          # LANGUAGE MATRIX SVG
          # ============================================================

          language_svg = ""

          language_y = 280

          for language, percentage in top_languages:

              width = max(
                  8,
                  min(
                      360,
                      percentage * 3.6
                  )
              )

              color = language_colors.get(
                  language,
                  "#6366F1"
              )

              language_svg += f"""
              <text
                  x="650"
                  y="{language_y}"
                  class="mono"
                  font-size="14"
              >
                  {escape(language)}
              </text>

              <rect
                  x="650"
                  y="{language_y + 10}"
                  width="360"
                  height="10"
                  rx="5"
                  fill="#111827"
              />

              <rect
                  x="650"
                  y="{language_y + 10}"
                  width="{width}"
                  height="10"
                  rx="5"
                  fill="{color}"
              />

              <text
                  x="1030"
                  y="{language_y + 19}"
                  class="muted"
                  font-size="11"
              >
                  {percentage:.1f}%
              </text>
              """

              language_y += 42


          # ============================================================
          # CONTRIBUTION HEATMAP SVG
          # ============================================================

          heatmap_svg = ""

          # Position of the actual GitHub-style graph
          graph_x = 150
          graph_y = 465

          square = 12
          gap = 4
          step = square + gap

          # Month labels
          previous_month = None

          for week_index, week in enumerate(weeks):

              days = week.get("contributionDays", [])

              if not days:
                  continue

              first_day = days[0]

              date_string = first_day["date"]

              try:
                  current_date = datetime.strptime(
                      date_string,
                      "%Y-%m-%d"
                  )
              except ValueError:
                  continue

              month_key = (
                  current_date.year,
                  current_date.month
              )

              if month_key != previous_month:

                  month_name = current_date.strftime("%b")

                  heatmap_svg += f"""
                  <text
                      x="{graph_x + week_index * step}"
                      y="{graph_y - 18}"
                      class="muted"
                      font-size="11"
                  >
                      {month_name}
                  </text>
                  """

                  previous_month = month_key


              # Contribution squares
              for day in days:

                  weekday = int(day.get("weekday", 0))

                  x = (
                      graph_x
                      + week_index * step
                  )

                  y = (
                      graph_y
                      + weekday * step
                  )

                  color = day.get(
                      "color",
                      "#161B22"
                  )

                  count = day.get(
                      "contributionCount",
                      0
                  )

                  date_value = day.get(
                      "date",
                      ""
                  )

                  # Real GitHub color + real contribution count
                  heatmap_svg += f"""
                  <rect
                      x="{x}"
                      y="{y}"
                      width="{square}"
                      height="{square}"
                      rx="3"
                      fill="{escape(color)}"
                      opacity="0.95"
                  >
                      <title>
                          {escape(date_value)} — {count} contribution{"s" if count != 1 else ""}
                      </title>
                  </rect>
                  """


          # Day labels
          day_labels = [
              ("Mon", 1),
              ("Wed", 3),
              ("Fri", 5)
          ]

          for label, weekday in day_labels:

              y = (
                  graph_y
                  + weekday * step
                  + 10
              )

              heatmap_svg += f"""
              <text
                  x="105"
                  y="{y}"
                  class="muted"
                  font-size="10"
              >
                  {label}
              </text>
              """


          # Legend
          legend_x = 850
          legend_y = 580

          legend_colors = [
              "#161B22",
              "#0E4429",
              "#006D32",
              "#26A641",
              "#39D353"
          ]

          heatmap_svg += f"""
          <text
              x="150"
              y="{legend_y}"
              class="muted"
              font-size="11"
          >
              LESS
          </text>
          """

          for index, color in enumerate(legend_colors):

              heatmap_svg += f"""
              <rect
                  x="{190 + index * 20}"
                  y="{legend_y - 10}"
                  width="12"
                  height="12"
                  rx="3"
                  fill="{color}"
              />
              """

          heatmap_svg += f"""
          <text
              x="300"
              y="{legend_y}"
              class="muted"
              font-size="11"
          >
              MORE
          </text>
          """


          # ============================================================
          # TIMESTAMP
          # ============================================================

          updated_at = datetime.now(
              timezone.utc
          ).strftime(
              "%d %b %Y • %H:%M UTC"
          )


          # ============================================================
          # FINAL SVG
          # ============================================================

          svg = f"""<svg
          width="1200"
          height="650"
          viewBox="0 0 1200 650"
          fill="none"
          xmlns="http://www.w3.org/2000/svg">

          <defs>

            <linearGradient
                id="bg"
                x1="0"
                y1="0"
                x2="1200"
                y2="650"
                gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#050816"/>
              <stop
                  offset="0.5"
                  stop-color="#0B1120"
              />
              <stop
                  offset="1"
                  stop-color="#111827"
              />
            </linearGradient>

            <linearGradient
                id="cyanLine"
                x1="0"
                y1="0"
                x2="1200"
                y2="0"
            >
              <stop stop-color="#22D3EE"/>
              <stop
                  offset="0.5"
                  stop-color="#6366F1"
              />
              <stop
                  offset="1"
                  stop-color="#22D3EE"
              />
            </linearGradient>

            <pattern
                id="grid"
                width="32"
                height="32"
                patternUnits="userSpaceOnUse"
            >
              <path
                  d="M 32 0 L 0 0 0 32"
                  fill="none"
                  stroke="#1E293B"
                  stroke-width="1"
                  opacity="0.35"
              />
            </pattern>

            <filter
                id="glow"
                x="-50%"
                y="-50%"
                width="200%"
                height="200%"
            >
              <feGaussianBlur
                  stdDeviation="4"
                  result="blur"
              />
              <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>

            <style>
              .mono {{
                font-family:
                  "SFMono-Regular",
                  Consolas,
                  "Liberation Mono",
                  monospace;
                fill: #E2E8F0;
                letter-spacing: 0.5px;
              }}

              .muted {{
                font-family:
                  "SFMono-Regular",
                  Consolas,
                  "Liberation Mono",
                  monospace;
                fill: #64748B;
                letter-spacing: 0.4px;
              }}

              .cyan {{
                fill: #22D3EE;
              }}

              .panel {{
                fill: #080F1D;
                stroke: #1E293B;
                stroke-width: 1;
              }}
            </style>

          </defs>


          <!-- BACKGROUND -->

          <rect
              width="1200"
              height="650"
              rx="24"
              fill="url(#bg)"
          />

          <rect
              width="1200"
              height="650"
              rx="24"
              fill="url(#grid)"
          />

          <rect
              x="1"
              y="1"
              width="1198"
              height="648"
              rx="23"
              stroke="url(#cyanLine)"
              stroke-width="2"
              opacity="0.75"
          />


          <!-- HEADER -->

          <text
              x="52"
              y="58"
              class="mono"
              font-size="25"
              font-weight="700"
          >
              GITHUB // LIVE TELEMETRY
          </text>

          <text
              x="52"
              y="84"
              class="muted"
              font-size="12"
          >
              {USERNAME} • AUTO-UPDATED FROM GITHUB API
          </text>


          <!-- LIVE INDICATOR -->

          <circle
              cx="1085"
              cy="54"
              r="6"
              fill="#22D3EE"
              filter="url(#glow)"
          />

          <text
              x="1100"
              y="59"
              class="cyan mono"
              font-size="12"
              font-weight="700"
          >
              LIVE
          </text>


          <!-- PROFILE CORE -->

          <rect
              x="52"
              y="115"
              width="548"
              height="145"
              rx="16"
              class="panel"
          />

          <text
              x="76"
              y="143"
              class="cyan mono"
              font-size="11"
              font-weight="700"
          >
              PROFILE CORE
          </text>


          <text
              x="76"
              y="181"
              class="muted"
              font-size="11"
          >
              PUBLIC REPOSITORIES
          </text>

          <text
              x="76"
              y="220"
              class="mono"
              font-size="31"
              font-weight="700"
          >
              {public_repos}
          </text>


          <text
              x="250"
              y="181"
              class="muted"
              font-size="11"
          >
              TOTAL STARS
          </text>

          <text
              x="250"
              y="220"
              class="mono"
              font-size="31"
              font-weight="700"
          >
              {total_stars}
          </text>


          <text
              x="420"
              y="181"
              class="muted"
              font-size="11"
          >
              TOTAL FORKS
          </text>

          <text
              x="420"
              y="220"
              class="mono"
              font-size="31"
              font-weight="700"
          >
              {total_forks}
          </text>


          <!-- LANGUAGE MATRIX -->

          <rect
              x="620"
              y="115"
              width="528"
              height="245"
              rx="16"
              class="panel"
          />

          <text
              x="645"
              y="143"
              class="cyan mono"
              font-size="11"
              font-weight="700"
          >
              LANGUAGE MATRIX
          </text>

          {language_svg}


          <!-- PROFILE FOCUS -->

          <rect
              x="52"
              y="280"
              width="548"
              height="80"
              rx="16"
              class="panel"
          />

          <text
              x="76"
              y="307"
              class="cyan mono"
              font-size="11"
              font-weight="700"
          >
              PROFILE FOCUS
          </text>

          <text
              x="76"
              y="337"
              class="mono"
              font-size="16"
              font-weight="700"
          >
              UNIVERSE-FLIX
          </text>

          <text
              x="270"
              y="337"
              class="muted"
              font-size="11"
          >
              MOVIE DISCOVERY • WEB DEVELOPMENT
          </text>


          <!-- CONTRIBUTION ACTIVITY -->

          <rect
              x="52"
              y="385"
              width="1096"
              height="220"
              rx="16"
              class="panel"
          />

          <text
              x="76"
              y="416"
              class="cyan mono"
              font-size="11"
              font-weight="700"
          >
              CONTRIBUTION ACTIVITY
          </text>

          <text
              x="900"
              y="416"
              class="mono"
              font-size="13"
              font-weight="700"
          >
              {total_contributions} CONTRIBUTIONS
          </text>

          {heatmap_svg}


          <!-- FOOTER -->

          <line
              x1="52"
              y1="620"
              x2="1148"
              y2="620"
              stroke="#1E293B"
          />

          <text
              x="52"
              y="640"
              class="muted"
              font-size="10"
          >
              LAST SYNC • {updated_at}
          </text>

          <text
              x="1148"
              y="640"
              class="muted"
              font-size="10"
              text-anchor="end"
          >
              SOURCE: GITHUB GRAPHQL
          </text>

          </svg>
          """


          # ============================================================
          # WRITE FILE
          # ============================================================

          os.makedirs("assets", exist_ok=True)

          with open(
              "assets/github.svg",
              "w",
              encoding="utf-8"
          ) as file:
              file.write(svg)

          print(
              "Dashboard generated successfully."
          )

          print(
              f"Repositories: {public_repos}"
          )

          print(
              f"Stars: {total_stars}"
          )

          print(
              f"Forks: {total_forks}"
          )

          print(
              f"Contributions: {total_contributions}"
          )

          PY
      - name: Commit dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github.svg

          if git diff --cached --quiet; then
            echo "No dashboard changes."
            exit 0
          fi

          git commit -m "Update GitHub dashboard"

          git fetch origin main
          git rebase origin/main

          git push origin HEAD:main

     
