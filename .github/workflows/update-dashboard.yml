          </rect>

          <text
            x="385"
            y="588"
            class="mono"
            font-size="12">

            60%

          </text>

          <!-- CONTRIBUTION STATUS -->

          <rect
            x="600"
            y="495"
            width="548"
            height="120"
            rx="24"
            fill="#07111F"
            stroke="#164E63"/>

          <text
            x="626"
            y="532"
            class="heading"
            font-size="18">

            CONTRIBUTION ACTIVITY

          </text>

          <text
            x="626"
            y="558"
            class="mono"
            font-size="14">

            GitHub contribution calendar

          </text>

          <text
            x="626"
            y="583"
            class="muted"
            font-size="11">

            Contribution totals require GitHub contribution API access.

          </text>

          <rect
            x="1004"
            y="535"
            width="110"
            height="38"
            rx="12"
            fill="#020617"
            stroke="#334155"/>

          <circle
            cx="1024"
            cy="554"
            r="5"
            fill="#22D3EE"
            filter="url(#glow)"/>

          <text
            x="1038"
            y="559"
            class="mono"
            font-size="10">

            SYNCED

          </text>

          <!-- FOOTER -->

          <text
            x="600"
            y="646"
            text-anchor="middle"
            class="muted"
            font-size="10">

