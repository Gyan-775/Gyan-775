                  fill="{color}"
                  font-family="monospace"
                  font-size="9"
                  font-weight="700"
              >
                  {escape(language[:10])}
              </text>
              """


          # Player

          tech_game_svg += """
          <!-- PLAYER -->

          <ellipse
              cx="35"
              cy="222"
              rx="15"
              ry="4"
              fill="#020617"
          />

          <rect
              x="24"
              y="196"
              width="20"
              height="20"
              rx="6"
              fill="#E2E8F0"
          />

          <rect
              x="27"
              y="199"
              width="14"
              height="10"
              rx="3"
              fill="#0F172A"
              stroke="#22D3EE"
              stroke-width="1"
          />

          <circle
              cx="31"
              cy="203"
              r="1.5"
              fill="#22D3EE"
          />

          <circle
              cx="37"
