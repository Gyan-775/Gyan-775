name: Update GitHub Dashboard

on:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github.svg"

  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate live GitHub dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone

          USERNAME = "Gyan-775"
          TOKEN = os.environ["GITHUB_TOKEN"]

          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Gyan-775-Live-Telemetry"
          }


          # ============================================================
          # API
          # ============================================================

          def github_get(url):
              req = urllib.request.Request(
                  url,
                  headers=HEADERS
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )


          def github_graphql(query, variables=None):

              payload = {
                  "query": query,
                  "variables": variables or {}
              }

              data = json.dumps(payload).encode("utf-8")

              req = urllib.request.Request(
                  "https://api.github.com/graphql",
                  data=data,
                  headers={
                      **HEADERS,
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.loads(
                      response.read().decode("utf-8")
                  )

              if "errors" in result:
                  raise RuntimeError(
                      json.dumps(result["errors"])
                  )

              return result["data"]


          def escape(value):
              return (
                  str(value)
                  .replace("&", "&amp;")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
                  .replace('"', "&quot;")
              )


          # ============================================================
          # PROFILE
          # ============================================================

          user = github_get(
              f"https://api.github.com/users/{USERNAME}"
          )

          public_repos = user.get("public_repos", 0)


          # ============================================================
          # REPOSITORIES
          # ============================================================

          repositories = []

          page = 1

          while True:

              repos = github_get(
                  f"https://api.github.com/users/{USERNAME}/repos"
                  f"?per_page=100&page={page}&type=owner"
              )

              if not repos:
                  break

              repositories.extend(repos)

              if len(repos) < 100:
                  break

              page += 1


          real_repositories = [
              repo for repo in repositories
              if not repo.get("fork")
          ]

          total_stars = sum(
              repo.get("stargazers_count", 0)
              for repo in real_repositories
          )

          total_forks = sum(
              repo.get("forks_count", 0)
              for repo in real_repositories
          )


          # ============================================================
          # LANGUAGES
          # ============================================================

          language_totals = {}

          for repo in real_repositories:

              try:

                  languages = github_get(
                      repo["languages_url"]
                  )

                  for language, amount in languages.items():

                      language_totals[language] = (
                          language_totals.get(language, 0)
                          + amount
                      )

              except Exception as error:

                  print(
                      f"Language error for "
                      f"{repo.get('name')}: {error}"
                  )


          language_totals = dict(
              sorted(
                  language_totals.items(),
                  key=lambda item: item[1],
                  reverse=True
              )
          )


          # ============================================================
          # REAL CONTRIBUTION CALENDAR
          # ============================================================

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    firstDay
                    contributionDays {
                      date
                      weekday
                      contributionCount
                      color
                    }
                  }
                }
              }
            }
          }
          """

          contribution_data = github_graphql(
              query,
              {"login": USERNAME}
          )

          calendar = (
              contribution_data["user"]
              ["contributionsCollection"]
              ["contributionCalendar"]
          )

          total_contributions = calendar[
              "totalContributions"
          ]

          weeks = calendar["weeks"]


          # ============================================================
          # TECH STACK DATA
          # ============================================================

          # GitHub's real language data.
          # These are displayed as the game's collectible platforms.

          stack_colors = {
              "JavaScript": "#F7DF1E",
              "TypeScript": "#3178C6",
              "Python": "#3776AB",
              "Java": "#F89820",
              "HTML": "#E34F26",
              "CSS": "#1572B6",
              "C++": "#00599C",
              "C": "#A8B9CC",
              "Go": "#00ADD8",
              "PHP": "#777BB4",
              "Kotlin": "#A97BFF",
              "Rust": "#DEA584",
              "Dart": "#0175C2",
              "Shell": "#22C55E",
              "Swift": "#F05138",
              "Ruby": "#CC342D"
          }


          # Keep the game readable.
          # Show up to 6 real languages.

          top_languages = list(
              language_totals.keys()
          )[:6]


          # If fewer languages exist, use the known learning stack
          # to make the arcade visually complete.

          fallback_stack = [
              "HTML",
              "CSS",
              "JavaScript",
              "Python",
              "Java"
          ]

          for language in fallback_stack:

              if language not in top_languages:

                  if len(top_languages) < 6:
                      top_languages.append(language)


          top_languages = top_languages[:6]


          # ============================================================
          # TECH STACK ARCADE
          # ============================================================

          tech_game_svg = ""

          platform_x_positions = [
              30,
              105,
              180,
              255,
              330,
              405
          ]

          platform_y_positions = [
              135,
              105,
              130,
              92,
              120,
              78
          ]


          # Background stars

          stars = [
              (35, 38),
              (82, 55),
              (140, 32),
              (212, 50),
              (285, 35),
              (350, 54),
              (430, 32),
              (470, 60)
          ]

          for sx, sy in stars:

              tech_game_svg += f"""
              <circle
                  cx="{sx}"
                  cy="{sy}"
                  r="1.5"
                  fill="#22D3EE"
                  opacity="0.8"
              />

              <circle
                  cx="{sx}"
                  cy="{sy}"
                  r="4"
                  fill="#22D3EE"
                  opacity="0.08"
              />
              """


          # Moon / glow

          tech_game_svg += """
          <circle
              cx="465"
              cy="48"
              r="20"
              fill="#312E81"
              opacity="0.35"
          />

          <circle
              cx="458"
              cy="43"
              r="13"
              fill="#6366F1"
              opacity="0.12"
          />
          """


          # Mountains

          tech_game_svg += """
          <path
              d="
                M0 205
                L65 145
                L105 178
                L155 125
                L215 182
                L270 140
                L330 190
                L390 135
                L450 180
                L510 130
                L528 155
                L528 245
                L0 245
                Z
              "
              fill="#0F172A"
          />

          <path
              d="
                M0 220
                L90 170
                L150 210
                L220 165
                L300 215
                L380 170
                L460 215
                L528 175
                L528 245
                L0 245
                Z
              "
              fill="#111827"
          />
          """


          # Game platforms

          for index, language in enumerate(top_languages):

              x = platform_x_positions[index]
              y = platform_y_positions[index]

              color = stack_colors.get(
                  language,
                  "#22D3EE"
              )

              # platform shadow

              tech_game_svg += f"""
              <rect
                  x="{x}"
                  y="{y + 31}"
                  width="64"
                  height="8"
                  rx="4"
                  fill="#020617"
              />

              <rect
                  x="{x}"
