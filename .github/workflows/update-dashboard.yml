          />

          <path
              d="M98 180 L105 185 L97 188"
              fill="none"
              stroke="#22D3EE"
              stroke-width="1.5"
          />
          """


          # Finish flag

          tech_game_svg += """
          <line
              x1="480"
              y1="80"
              x2="480"
              y2="160"
              stroke="#CBD5E1"
              stroke-width="2"
          />

          <path
              d="M480 80 L515 91 L480 103 Z"
              fill="#22D3EE"
          />

          <text
              x="480"
              y="176"
              text-anchor="middle"
              fill="#22D3EE"
              font-family="monospace"
              font-size="7"
              font-weight="700"
          >
              BUILD
          </text>
          """


          # HUD

          tech_game_svg += f"""
          <text
              x="20"
              y="20"
              fill="#22D3EE"
              font-family="monospace"
              font-size="9"
              font-weight="700"
          >
              TECH STACK ARCADE
          </text>

          <text
              x="20"
              y="32"
              fill="#64748B"
              font-family="monospace"
              font-size="6"
          >
              COLLECT • LEARN • BUILD • LEVEL UP
          </text>

          <rect
              x="398"
              y="12"
              width="108"
              height="22"
              rx="6"
              fill="#071426"
              stroke="#22D3EE"
              stroke-width="1"
          />

          <text
              x="452"
              y="26"
              text-anchor="middle"
              fill="#22D3EE"
              font-family="monospace"
              font-size="8"
              font-weight="700"
          >
              LEVEL ∞
          </text>

          <rect
              x="365"
              y="190"
              width="142"
              height="42"
              rx="7"
              fill="#06111F"
              stroke="#22D3EE"
              stroke-width="1"
          />

          <text
              x="378"
              y="207"
              fill="#22D3EE"
              font-family="monospace"
              font-size="8"
              font-weight="700"
          >
              STACKS UNLOCKED
          </text>

          <text
              x="378"
              y="222"
              fill="#E2E8F0"
              font-family="monospace"
              font-size="8"
          >
              {len(top_languages)} / {len(top_languages)}
          </text>
          """


          # ============================================================
          # CONTRIBUTION HEATMAP
          # ============================================================

          heatmap_svg = ""

          graph_x = 150
          graph_y = 465

          square = 12
          gap = 4
          step = square + gap

          previous_month = None


          for week_index, week in enumerate(weeks):

              days = week.get(
                  "contributionDays",
                  []
              )

              if not days:
                  continue

              first_day = days[0]

              try:
                  current_date = datetime.strptime(
                      first_day["date"],
                      "%Y-%m-%d"
                  )
              except ValueError:
                  continue


              month_key = (
                  current_date.year,
                  current_date.month
              )

              if month_key != previous_month:

                  heatmap_svg += f"""
                  <text
                      x="{graph_x + week_index * step}"
                      y="{graph_y - 18}"
                      class="muted"
                      font-size="11"
                  >
                      {current_date.strftime("%b")}
                  </text>
                  """

                  previous_month = month_key


              for day in days:

                  weekday = int(
                      day.get("weekday", 0)
                  )

                  x = (
                      graph_x
                      + week_index * step
                  )

                  y = (
                      graph_y
                      + weekday * step
                  )

                  color = day.get(
                      "color",
                      "#161B22"
                  )

                  count = day.get(
                      "contributionCount",
                      0
                  )

                  date_value = day.get(
                      "date",
                      ""
                  )

                  heatmap_svg += f"""
                  <rect
                      x="{x}"
                      y="{y}"
                      width="{square}"
                      height="{square}"
                      rx="3"
                      fill="{escape(color)}"
                  >
                      <title>
                          {escape(date_value)}
                          — {count} contribution{"s" if count != 1 else ""}
                      </title>
                  </rect>
                  """


          # Day labels

          for label, weekday in [
              ("Mon", 1),
              ("Wed", 3),
              ("Fri", 5)
          ]:

              y = (
                  graph_y
                  + weekday * step
                  + 10
              )

              heatmap_svg += f"""
              <text
                  x="105"
                  y="{y}"
                  class="muted"
                  font-size="10"
              >
                  {label}
              </text>
              """


          # Contribution legend

          legend_colors = [
              "#161B22",
              "#0E4429",
              "#006D32",
              "#26A641",
              "#39D353"
          ]

          heatmap_svg += """
          <text
              x="150"
              y="580"
              class="muted"
              font-size="11"
          >
              LESS
          </text>
          """

          for i, color in enumerate(legend_colors):

              heatmap_svg += f"""
              <rect
                  x="{190 + i * 20}"
                  y="570"
                  width="12"
                  height="12"
                  rx="3"
                  fill="{color}"
              />
              """

          heatmap_svg += """
          <text
              x="300"
              y="580"
              class="muted"
              font-size="11"
          >
              MORE
          </text>
          """


          # ============================================================
          # TIMESTAMP
          # ============================================================

          updated_at = datetime.now(
              timezone.utc
          ).strftime(
              "%d %b %Y • %H:%M UTC"
          )


          # ============================================================
          # FINAL SVG
          # ============================================================

          svg = f"""<svg
          width="1200"
