            font-size="13"
            fill="#22D3EE">

            {total_forks}

          </text>

          <!-- LANGUAGE MATRIX -->

          <rect
            x="600"
            y="135"
            width="548"
            height="340"
            rx="24"
            fill="#07111F"
            stroke="#312E81"/>

          <text
            x="626"
            y="174"
            class="heading"
            font-size="20">

            LANGUAGE MATRIX

          </text>

          <text
            x="626"
            y="198"
            class="muted"
            font-size="11">

            REAL REPOSITORY LANGUAGE DATA

          </text>

          {language_svg}

          <!-- FEATURE -->

          <rect
            x="52"
            y="385"
            width="520"
            height="230"
            rx="24"
            fill="#07111F"
            stroke="#7E22CE"/>

          <text
            x="78"
            y="424"
