<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Featured project Universe-Flix">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b15"/>
      <stop offset="55%" stop-color="#0c1230"/>
      <stop offset="100%" stop-color="#1a0d2d"/>
    </linearGradient>
    <linearGradient id="uedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="uglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#ubg)"/>
  <rect x="1" y="1" width="1198" height="498" rx="23" stroke="url(#uedge)" stroke-opacity="0.38"/>
  <rect x="0" y="340" width="1200" height="4" fill="url(#hline)" opacity="0.7" filter="url(#uglow)">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="4.8s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.4">
    <rect x="70" y="92" width="14" height="210" rx="2" fill="#334155"/>
    <rect x="90" y="92" width="14" height="210" rx="2" fill="#334155"/>
    <rect x="110" y="92" width="14" height="210" rx="2" fill="#334155"/>
  </g>

  <rect x="150" y="78" width="320" height="360" rx="18" fill="#0b1224" stroke="#7dd3fc" stroke-opacity="0.35"/>
  <circle cx="310" cy="240" r="92" fill="#0d1a35" stroke="#8b5cf6" stroke-opacity="0.5"/>
  <polygon points="286,190 286,290 362,240" fill="#d8f3ff" opacity="0.9"/>

  <text x="520" y="116" fill="#dff4ff" font-family="'Segoe UI', Arial, sans-serif" font-size="24" letter-spacing="2">FEATURED PROJECT</text>
  <text x="520" y="178" fill="#f3f0ff" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" filter="url(#uglow)">UNIVERSE-FLIX</text>
  <text x="520" y="214" fill="#8be9ff" font-family="'JetBrains Mono', monospace" font-size="21">A cinematic movie discovery platform.</text>

  <g font-family="'JetBrains Mono', monospace" font-size="20" fill="#d7efff">
    <text x="520" y="270">Movie Discovery</text>
    <text x="790" y="270">Movie Universes</text>
    <text x="520" y="305">Search</text>
    <text x="790" y="305">Watch Orders</text>
    <text x="520" y="340">Ratings</text>
    <text x="790" y="340">Recommendations</text>
  </g>

  <a href="https://github.com/Gyan-775/Universe-flix-2.0" target="_blank">
    <g transform="translate(520,382)">
      <rect width="290" height="54" rx="27" fill="#0f172a" stroke="#67e8f9"/>
      <rect x="6" y="6" width="278" height="42" rx="21" fill="url(#hline)" opacity="0.2"/>
      <text x="145" y="34" text-anchor="middle" fill="#e8f8ff" font-family="'JetBrains Mono', monospace" font-size="19">VIEW REPOSITORY</text>
    </g>
  </a>

  <rect x="-260" y="0" width="170" height="500" fill="#b5f3ff" opacity="0.09" transform="skewX(-22)">
    <animate attributeName="x" values="-260;1380" dur="10s" repeatCount="indefinite"/>
  </rect>

  <g fill="#8bd3ff">
    <circle cx="1120" cy="80" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1088" cy="126" r="1.6"><animate attributeName="cy" values="126;118;126" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1046" cy="92" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
