<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Featured project Universe-Flix">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b15"/>
      <stop offset="55%" stop-color="#0c1230"/>
      <stop offset="100%" stop-color="#1a0d2d"/>
    </linearGradient>
    <linearGradient id="uedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="posterBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050913"/>
      <stop offset="48%" stop-color="#0a1732"/>
      <stop offset="100%" stop-color="#2a1140"/>
    </linearGradient>
    <linearGradient id="posterHorizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="posterSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="48%" stop-color="#a5f3fc" stop-opacity="0.35"/>
      <stop offset="52%" stop-color="#c4b5fd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="uglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.05"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="500" rx="24" fill="url(#ubg)"/>
  <rect x="1" y="1" width="1198" height="498" rx="23" stroke="url(#uedge)" stroke-opacity="0.38"/>
  <rect x="0" y="340" width="1200" height="4" fill="url(#hline)" opacity="0.7" filter="url(#uglow)">
    <animate attributeName="opacity" values="0.3;0.85;0.3" dur="4.8s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0.4">
    <rect x="72" y="70" width="14" height="360" rx="2" fill="#334155"/>
    <rect x="94" y="70" width="14" height="360" rx="2" fill="#334155"/>
    <rect x="116" y="70" width="14" height="360" rx="2" fill="#334155"/>
  </g>

  <g transform="translate(165 62)">
    <rect width="280" height="376" rx="18" fill="#0a1122" stroke="#7dd3fc" stroke-opacity="0.38"/>
    <rect x="14" y="14" width="252" height="348" rx="12" fill="url(#posterBg)" stroke="#38bdf8" stroke-opacity="0.28"/>
    <rect x="14" y="14" width="252" height="348" rx="12" fill="url(#posterSweep)" opacity="0.18" transform="translate(-290 0) skewX(-20)">
      <animate attributeName="x" values="-340;420" dur="8.5s" repeatCount="indefinite"/>
    </rect>

    <g opacity="0.28">
      <circle cx="55" cy="66" r="1.7" fill="#93c5fd"/>
      <circle cx="96" cy="84" r="1.2" fill="#67e8f9"/>
      <circle cx="147" cy="54" r="1.5" fill="#a78bfa"/>
      <circle cx="202" cy="78" r="1.3" fill="#67e8f9"/>
      <circle cx="231" cy="61" r="1.5" fill="#c4b5fd"/>
      <circle cx="180" cy="112" r="1.1" fill="#93c5fd"/>
      <circle cx="74" cy="112" r="1.1" fill="#93c5fd"/>
    </g>

    <rect x="18" y="210" width="244" height="2" fill="url(#posterHorizon)" opacity="0.75"/>
    <rect x="18" y="212" width="244" height="122" fill="url(#hline)" opacity="0.08"/>
    <ellipse cx="140" cy="230" rx="118" ry="52" fill="#67e8f9" opacity="0.08" filter="url(#uglow)"/>

    <rect x="25" y="20" width="8" height="336" rx="4" fill="#060c18" stroke="#334155"/>
    <rect x="247" y="20" width="8" height="336" rx="4" fill="#060c18" stroke="#334155"/>
    <g fill="#1e293b">
      <circle cx="29" cy="40" r="1.5"/><circle cx="29" cy="62" r="1.5"/><circle cx="29" cy="84" r="1.5"/><circle cx="29" cy="106" r="1.5"/>
      <circle cx="29" cy="128" r="1.5"/><circle cx="29" cy="150" r="1.5"/><circle cx="29" cy="172" r="1.5"/><circle cx="29" cy="194" r="1.5"/>
      <circle cx="29" cy="216" r="1.5"/><circle cx="29" cy="238" r="1.5"/><circle cx="29" cy="260" r="1.5"/><circle cx="29" cy="282" r="1.5"/>
      <circle cx="29" cy="304" r="1.5"/><circle cx="29" cy="326" r="1.5"/>
      <circle cx="251" cy="40" r="1.5"/><circle cx="251" cy="62" r="1.5"/><circle cx="251" cy="84" r="1.5"/><circle cx="251" cy="106" r="1.5"/>
      <circle cx="251" cy="128" r="1.5"/><circle cx="251" cy="150" r="1.5"/><circle cx="251" cy="172" r="1.5"/><circle cx="251" cy="194" r="1.5"/>
      <circle cx="251" cy="216" r="1.5"/><circle cx="251" cy="238" r="1.5"/><circle cx="251" cy="260" r="1.5"/><circle cx="251" cy="282" r="1.5"/>
      <circle cx="251" cy="304" r="1.5"/><circle cx="251" cy="326" r="1.5"/>
    </g>

    <text x="140" y="282" text-anchor="middle" fill="#f3f7ff" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="1.2">UNIVERSE-FLIX</text>
    <text x="140" y="303" text-anchor="middle" fill="#8be9ff" font-family="JetBrains Mono, monospace" font-size="9.8" letter-spacing="1">MOVIES • UNIVERSES • WATCH ORDERS</text>
    <text x="36" y="329" fill="#bfdbfe" font-family="JetBrains Mono, monospace" font-size="8.8" letter-spacing="0.8">CATALOG: 1000+ TITLES</text>
    <text x="36" y="343" fill="#c4b5fd" font-family="JetBrains Mono, monospace" font-size="8.8" letter-spacing="0.8">MODES: SAGA • TIMELINE • PHASE</text>

    <rect x="14" y="14" width="252" height="348" rx="12" fill="#ffffff" opacity="0.12" filter="url(#grain)"/>
  </g>

  <text x="520" y="116" fill="#dff4ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" letter-spacing="2">FEATURED PROJECT</text>
  <text x="520" y="178" fill="#f3f0ff" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" filter="url(#uglow)">UNIVERSE-FLIX</text>
  <text x="520" y="214" fill="#8be9ff" font-family="JetBrains Mono, monospace" font-size="21">A cinematic movie discovery platform.</text>

  <g font-family="JetBrains Mono, monospace" font-size="19" fill="#d7efff">
    <text x="520" y="270">Movie Discovery</text>
    <text x="800" y="270">Universe Navigation</text>
    <text x="520" y="304">Search + Metadata</text>
    <text x="800" y="304">Watch Orders</text>
    <text x="520" y="338">Ratings + Signals</text>
    <text x="800" y="338">Recommendations</text>
  </g>

  <g transform="translate(520 378)">
    <rect width="300" height="56" rx="28" fill="#0f172a" stroke="#67e8f9"/>
    <rect x="7" y="7" width="286" height="42" rx="21" fill="url(#hline)" opacity="0.2"/>
    <text x="150" y="35" text-anchor="middle" fill="#e8f8ff" font-family="JetBrains Mono, monospace" font-size="19" letter-spacing="1">VIEW REPOSITORY</text>
  </g>

  <rect x="-260" y="0" width="170" height="500" fill="#b5f3ff" opacity="0.09" transform="skewX(-22)">
    <animate attributeName="x" values="-260;1380" dur="10s" repeatCount="indefinite"/>
  </rect>

  <g fill="#8bd3ff">
    <circle cx="1120" cy="80" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1088" cy="126" r="1.6"><animate attributeName="cy" values="126;118;126" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1046" cy="92" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
