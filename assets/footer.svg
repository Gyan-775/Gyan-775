<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cinematic footer">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#130b23"/>
    </linearGradient>
    <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="22" fill="url(#fbg)"/>
  <line x1="0" y1="110" x2="420" y2="110" stroke="url(#fline)" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="780" y1="110" x2="1200" y2="110" stroke="url(#fline)" stroke-width="2" stroke-opacity="0.8"/>

  <circle cx="300" cy="110" r="2" fill="#7dd3fc"><animate attributeName="cx" values="0;420;0" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="110" r="2" fill="#c4b5fd"><animate attributeName="cx" values="1200;780;1200" dur="6.5s" repeatCount="indefinite"/></circle>

  <text x="600" y="102" text-anchor="middle" fill="#e6f4ff" font-family="'JetBrains Mono', monospace" font-size="27">STILL LEARNING</text>
  <text x="600" y="136" text-anchor="middle" fill="#cde9ff" font-family="'JetBrains Mono', monospace" font-size="24">STILL BUILDING</text>
  <text x="600" y="170" text-anchor="middle" fill="#b8deff" font-family="'JetBrains Mono', monospace" font-size="22">STILL SHIPPING</text>
  <rect x="700" y="153" width="10" height="18" rx="2" fill="#b8deff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
