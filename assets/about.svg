<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About me panel">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="100%" stop-color="#170d2e"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="aglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#abg)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" stroke="url(#edge)" stroke-opacity="0.4"/>
  <rect x="26" y="24" width="1148" height="272" rx="20" fill="#0b1224" fill-opacity="0.72" stroke="#67e8f9" stroke-opacity="0.24"/>

  <text x="60" y="78" fill="#def5ff" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="2">ABOUT ME</text>
  <text x="60" y="124" fill="#c9edff" font-family="'Segoe UI', Arial, sans-serif" font-size="23">I'm Gyan, a developer and lifelong learner building real projects</text>
  <text x="60" y="154" fill="#c9edff" font-family="'Segoe UI', Arial, sans-serif" font-size="23">while learning how software actually works.</text>

  <g font-family="'JetBrains Mono', monospace" font-size="15" fill="#d4f4ff">
    <g transform="translate(60,206)">
      <circle r="8" fill="#0f172a" stroke="#22d3ee"/><circle r="3" fill="#22d3ee"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
      <text x="18" y="6">STUDENT</text>
    </g>
    <g transform="translate(250,206)">
      <circle r="8" fill="#0f172a" stroke="#60a5fa"/><circle r="3" fill="#60a5fa"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite"/></circle>
      <text x="18" y="6">BUILDING</text>
    </g>
    <g transform="translate(470,206)">
      <circle r="8" fill="#0f172a" stroke="#a78bfa"/><circle r="3" fill="#a78bfa"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/></circle>
      <text x="18" y="6">LEARNING</text>
    </g>
    <g transform="translate(690,206)">
      <circle r="8" fill="#0f172a" stroke="#f472b6"/><circle r="3" fill="#f472b6"><animate attributeName="opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <text x="18" y="6">EXPLORING</text>
    </g>
  </g>

  <line x1="60" y1="235" x2="1140" y2="235" stroke="url(#edge)" stroke-opacity="0.35"/>
  <text x="60" y="274" fill="#bbdcff" font-family="'JetBrains Mono', monospace" font-size="22" filter="url(#aglow)">"Consistency today. Better tomorrow."</text>
</svg>
