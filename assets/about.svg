</text>

<!-- terminal -->
<rect x="924" y="402" width="192" height="38"
      rx="10"
      fill="#020617"
      stroke="#1E293B"/>

<circle cx="941" cy="419" r="4" fill="#22C55E"/>

<text x="954" y="424"
      class="mono"
      font-size="10"
      fill="#94A3B8">
  READY_TO_BUILD_
</text>

<!-- footer quote -->
<rect x="56" y="485" width="1088" height="34"
      rx="12"
      fill="#020617"
      stroke="#1E293B"/>

<text x="600" y="507"
      text-anchor="middle"
      class="mono"
      font-size="12"
      fill="#A5B4FC">
  "Consistency today. Better tomorrow."
</text>

<!-- floating particles -->
<circle cx="410" cy="102" r="2.5" fill="#22D3EE">
  <animate attributeName="cy"
           values="102;90;102"
           dur="3s"
           repeatCount="indefinite"/>
</circle>

<circle cx="865" cy="95" r="2" fill="#A78BFA">
  <animate attributeName="cy"
           values="95;108;95"
           dur="2.6s"
           repeatCount="indefinite"/>
</circle>

<circle cx="1125" cy="120" r="2" fill="#22D3EE">
  <animate attributeName="cx"
           values="1125;1135;1125"
           dur="3.4s"
           repeatCount="indefinite"/>
</circle>

</svg>
