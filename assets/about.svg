<svg width="1200" height="560" viewBox="0 0 1200 560" fill="none"
     xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="560">
    <stop stop-color="#020617"/>
    <stop offset="0.48" stop-color="#0B1128"/>
    <stop offset="1" stop-color="#1B1035"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0">
    <stop stop-color="#22D3EE"/>
    <stop offset="0.5" stop-color="#6366F1"/>
    <stop offset="1" stop-color="#D946EF"/>
  </linearGradient>

  <linearGradient id="cyanPurple" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#22D3EE"/>
    <stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" stroke="#334155" stroke-opacity="0.16"/>
  </pattern>

  <style>
    .title {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;
      fill: #F8FAFC;
      letter-spacing: 2px;
    }

    .mono {
      font-family: "Courier New", monospace;
      fill: #CBD5E1;
    }

    .muted {
      font-family: "Courier New", monospace;
      fill: #64748B;
      letter-spacing: 1px;
    }

    .body {
      font-family: Arial, Helvetica, sans-serif;
      fill: #CBD5E1;
    }
  </style>

</defs>

<!-- BACKGROUND -->
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<rect width="1200" height="560" rx="28" fill="url(#grid)"/>

<!-- ambient glow -->
<circle cx="1040" cy="100" r="170" fill="#6366F1" opacity="0.10" filter="url(#softGlow)"/>
<circle cx="120" cy="470" r="160" fill="#22D3EE" opacity="0.07" filter="url(#softGlow)"/>

<!-- animated scanning line -->
<rect x="0" y="85" width="1200" height="2" fill="url(#line)" opacity="0.7">
  <animate
    attributeName="y"
    values="85;510;85"
    dur="7s"
    repeatCount="indefinite"/>
  <animate
    attributeName="opacity"
    values="0;0.8;0"
    dur="7s"
    repeatCount="indefinite"/>
</rect>

<!-- outer frame -->
<rect x="18" y="18" width="1164" height="524" rx="26"
      stroke="url(#line)" stroke-width="2"/>

<!-- corner accents -->
<path d="M45 82V46H81" stroke="#22D3EE" stroke-width="3" filter="url(#glow)"/>
<path d="M1119 46H1155V82" stroke="#8B5CF6" stroke-width="3" filter="url(#glow)"/>
<path d="M45 478V514H81" stroke="#8B5CF6" stroke-width="3"/>
<path d="M1119 514H1155V478" stroke="#22D3EE" stroke-width="3"/>

<!-- HEADER -->
<text x="58" y="78" class="title" font-size="30">
  ABOUT ME
</text>

<text x="60" y="105" class="muted" font-size="13">
  DEVELOPER PROFILE // PERSONAL SYSTEM
</text>

<!-- LEFT IDENTITY PANEL -->
<rect x="56" y="145" width="350" height="320" rx="22"
      fill="#07111F" fill-opacity="0.88"
      stroke="#164E63"/>

<!-- avatar core -->
<circle cx="132" cy="225" r="52"
        fill="#07111F"
        stroke="url(#cyanPurple)"
        stroke-width="3"
        filter="url(#glow)">
  <animate
    attributeName="r"
    values="50;54;50"
    dur="3s"
    repeatCount="indefinite"/>
</circle>

<circle cx="132" cy="225" r="38"
        fill="#0F172A"
        stroke="#22D3EE"
        stroke-opacity="0.5"/>

<text x="132" y="239"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="36"
      font-weight="700"
      fill="#F8FAFC">
  G
</text>

<circle cx="169" cy="263" r="7"
        fill="#22C55E"
        stroke="#07111F"
        stroke-width="4">
  <animate
    attributeName="opacity"
    values="1;0.45;1"
    dur="1.8s"
    repeatCount="indefinite"/>
</circle>

<text x="210" y="205" class="title" font-size="25">
  GYAN
</text>

<text x="210" y="232"
      class="mono"
      font-size="14"
      fill="#22D3EE">
  DEVELOPER
</text>

<text x="210" y="254"
      class="muted"
      font-size="12">
  BUILDER • LEARNER
</text>

<!-- identity lines -->
<text x="82" y="324" class="muted" font-size="12">
  CURRENT MODE
</text>

<text x="82" y="347" class="mono" font-size="16" fill="#22D3EE">
  BUILDING + LEARNING
</text>

<text x="82" y="388" class="muted" font-size="12">
  FLAGSHIP PROJECT
</text>

<text x="82" y="411"
      class="mono"
      font-size="16"
      fill="#A78BFA">
  UNIVERSE-FLIX
</text>

<!-- CENTER CONTENT -->
<rect x="432" y="145" width="440" height="320" rx="22"
      fill="#07111F" fill-opacity="0.88"
      stroke="#312E81"/>

<text x="462" y="188" class="title" font-size="22">
  THE MINDSET
</text>

<text x="462" y="224" class="body" font-size="17">
  I'm learning by building real things.
</text>

<text x="462" y="252" class="body" font-size="17">
  I don't want to only know syntax.
</text>

<text x="462" y="280" class="body" font-size="17">
  I want to understand how things work.
</text>

<!-- animated mindset line -->
<rect x="462" y="310" width="376" height="74"
      rx="16"
      fill="#0B172A"
      stroke="#1E40AF"/>

<text x="484" y="340"
      class="mono"
      font-size="14"
      fill="#22D3EE">
  LEARN
</text>

<text x="555" y="340"
      class="mono"
      font-size="14">
  →
</text>

<text x="585" y="340"
      class="mono"
      font-size="14"
      fill="#8B5CF6">
  BUILD
</text>

<text x="658" y="340"
      class="mono"
      font-size="14">
  →
</text>

<text x="690" y="340"
      class="mono"
      font-size="14"
      fill="#D946EF">
  BREAK
</text>

<text x="760" y="340"
      class="mono"
      font-size="14">
  →
</text>

<text x="790" y="340"
      class="mono"
      font-size="14"
      fill="#22D3EE">
  FIX
</text>

<text x="484" y="367"
      class="muted"
      font-size="11">
  turn knowledge into something real
</text>

<!-- RIGHT STATUS -->
<rect x="898" y="145" width="246" height="320" rx="22"
      fill="#07111F" fill-opacity="0.88"
      stroke="#7E22CE"/>

<text x="924" y="188" class="title" font-size="20">
  SYSTEM STATUS
</text>

<!-- status 1 -->
<circle cx="934" cy="230" r="6" fill="#22D3EE" filter="url(#glow)">
  <animate attributeName="r"
           values="5;8;5"
           dur="2s"
           repeatCount="indefinite"/>
</circle>

<text x="952" y="235" class="mono" font-size="13">
  FRONTEND
</text>

<text x="1110" y="235"
      text-anchor="end"
      class="muted"
      font-size="11">
  ACTIVE
</text>

<!-- status 2 -->
<circle cx="934" cy="275" r="6" fill="#8B5CF6" filter="url(#glow)">
  <animate attributeName="r"
           values="5;8;5"
           dur="2.4s"
           repeatCount="indefinite"/>
</circle>

<text x="952" y="280" class="mono" font-size="13">
  BACKEND
</text>

<text x="1110" y="280"
      text-anchor="end"
      class="muted"
      font-size="11">
  LEARNING
</text>

<!-- status 3 -->
<circle cx="934" cy="320" r="6" fill="#D946EF" filter="url(#glow)">
  <animate attributeName="r"
           values="5;8;5"
           dur="2.8s"
           repeatCount="indefinite"/>
</circle>

<text x="952" y="325" class="mono" font-size="13">
  JAVA
</text>

<text x="1110" y="325"
      text-anchor="end"
      class="muted"
      font-size="11">
  70%
</text>

<!-- status 4 -->
<circle cx="934" cy="365" r="6" fill="#22D3EE" filter="url(#glow)">
  <animate attributeName="r"
           values="5;8;5"
           dur="2.2s"
           repeatCount="indefinite"/>
</circle>

<text x="952" y="370" class="mono" font-size="13">
  JAVASCRIPT
</text>

<text x="1110" y="370"
      text-anchor="end"
      class="muted"
      font-size="11">
