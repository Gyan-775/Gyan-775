<svg
width="1200"
height="680"
viewBox="0 0 1200 680"
fill="none"
xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg"
    x1="0"
    y1="0"
    x2="1200"
    y2="680">

    <stop stop-color="#020617"/>
    <stop offset="0.45" stop-color="#0A1024"/>
    <stop offset="1" stop-color="#180B2F"/>

  </linearGradient>

  <linearGradient id="neon"
    x1="0"
    y1="0"
    x2="1200"
    y2="0">

    <stop stop-color="#22D3EE"/>
    <stop offset="0.5" stop-color="#6366F1"/>
    <stop offset="1" stop-color="#D946EF"/>

  </linearGradient>

  <filter id="glow">
    <feGaussianBlur
      stdDeviation="4"
      result="blur"/>

    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>

  </filter>

  <pattern
    id="grid"
    width="32"
    height="32"
    patternUnits="userSpaceOnUse">

    <path
      d="M32 0H0V32"
      stroke="#334155"
      stroke-opacity="0.14"/>

  </pattern>

  <style>

    .heading {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-weight: 700;
      fill: #F8FAFC;
      letter-spacing: 2px;
    }

    .mono {
      font-family:
        "Courier New",
        monospace;

      fill: #CBD5E1;
    }

    .muted {
      font-family:
        "Courier New",
        monospace;

      fill: #64748B;
      letter-spacing: 1px;
    }

    .metric {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-weight: 700;
      fill: #F8FAFC;
    }

  </style>

</defs>

<rect
  width="1200"
  height="680"
  rx="30"
