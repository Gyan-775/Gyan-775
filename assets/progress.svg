<svg width="1200" height="650" viewBox="0 0 1200 650" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Current learning progress dashboard">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#130b26"/>
    </linearGradient>
    <linearGradient id="trim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="jsFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="javaFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="pglow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="650" rx="24" fill="url(#pbg)"/>
  <rect x="1" y="1" width="1198" height="648" rx="23" stroke="url(#trim)" stroke-opacity="0.35"/>
  <text x="60" y="78" fill="#e5f4ff" font-family="'Segoe UI', Arial, sans-serif" font-size="38" font-weight="700">CURRENT LEARNING PROGRESS</text>

  <g font-family="'JetBrains Mono', monospace" font-size="24" fill="#d7efff">
    <text x="60" y="142">HTML / CSS</text><text x="370" y="142" fill="#67e8f9">90%</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="24" fill="#d7efff">
    <text x="60" y="205">JavaScript</text>
    <rect x="320" y="175" width="620" height="34" rx="17" fill="#0b1328" stroke="#234067"/>
    <rect x="320" y="175" width="372" height="34" rx="17" fill="url(#jsFill)" filter="url(#pglow)">
      <animate attributeName="width" values="0;372" dur="1.8s" fill="freeze"/>
    </rect>
    <rect x="290" y="175" width="90" height="34" rx="17" fill="#8be9ff" opacity="0.28">
      <animate attributeName="x" values="290;670;290" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="692" cy="192" r="5" fill="#a5f3fc"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/></circle>
    <text x="960" y="200" fill="#6ee7ff">60%</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="24" fill="#d7efff">
    <text x="60" y="272">Java</text>
    <rect x="320" y="242" width="620" height="34" rx="17" fill="#0b1328" stroke="#3e2b66"/>
    <rect x="320" y="242" width="434" height="34" rx="17" fill="url(#javaFill)" filter="url(#pglow)">
      <animate attributeName="width" values="0;434" dur="2.2s" fill="freeze"/>
    </rect>
    <rect x="300" y="242" width="88" height="34" rx="17" fill="#f5b3ff" opacity="0.22">
      <animate attributeName="x" values="300;735;300" dur="4.1s" repeatCount="indefinite"/>
    </rect>
    <circle cx="754" cy="259" r="5" fill="#f0abfc"><animate attributeName="r" values="4;7;4" dur="1.9s" repeatCount="indefinite"/></circle>
    <text x="960" y="267" fill="#d8b4fe">70%</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="22" fill="#d7efff">
    <text x="60" y="336">React</text><text x="370" y="336" fill="#7dd3fc">LEARNING</text>
    <text x="60" y="378">Node.js</text><text x="370" y="378" fill="#86efac">LEARNING</text>
    <text x="60" y="420">Express.js</text><text x="370" y="420" fill="#a5b4fc">LEARNING</text>
    <text x="60" y="462">MongoDB</text><text x="370" y="462" fill="#6ee7b7">LEARNING</text>
    <text x="60" y="504">Python</text><text x="370" y="504" fill="#93c5fd">LEARNING</text>
    <text x="60" y="546">DSA</text><text x="370" y="546" fill="#f9a8d4">LEARNING</text>
    <text x="60" y="588">Git / GitHub</text><text x="370" y="588" fill="#c4b5fd">IMPROVING</text>
  </g>

  <g>
    <circle cx="530" cy="329" r="4" fill="#7dd3fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="371" r="4" fill="#86efac"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="413" r="4" fill="#a5b4fc"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="455" r="4" fill="#6ee7b7"><animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="497" r="4" fill="#93c5fd"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="539" r="4" fill="#f9a8d4"><animate attributeName="opacity" values="1;0.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="530" cy="581" r="4" fill="#c4b5fd"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>
</svg>
