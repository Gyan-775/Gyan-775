<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gyan cinematic hero section">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="45%" stop-color="#0a1124"/>
      <stop offset="100%" stop-color="#170a2b"/>
      <animate attributeName="x2" values="1;0.4;1" dur="16s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f1140"/>
      <stop offset="50%" stop-color="#10c8ff"/>
      <stop offset="100%" stop-color="#7d3cff"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(930 110) rotate(90) scale(110)">
      <stop offset="0%" stop-color="#d7f8ff"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#60a5fa" stroke-opacity="0.08"/>
    </pattern>
    <clipPath id="clipAll"><rect width="1200" height="520" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#clipAll)">
    <rect width="1200" height="520" fill="url(#bgGrad)"/>
    <rect width="1200" height="520" fill="url(#grid)"/>

    <circle cx="930" cy="110" r="110" fill="url(#orb)">
      <animate attributeName="r" values="105;115;105" dur="7s" repeatCount="indefinite"/>
    </circle>

    <path d="M0 390C110 360 200 420 290 392C380 365 435 415 515 388C590 362 660 403 730 384C805 362 850 408 940 382C1028 356 1115 391 1200 372V520H0V390Z" fill="#070b15"/>
    <rect x="0" y="353" width="1200" height="4" fill="url(#horizon)" filter="url(#glow)">
      <animate attributeName="opacity" values="0.35;0.8;0.35" dur="5s" repeatCount="indefinite"/>
    </rect>

    <g stroke="#38bdf8" stroke-opacity="0.25" fill="none">
      <circle cx="330" cy="226" r="124"><animate attributeName="r" values="118;126;118" dur="10s" repeatCount="indefinite"/></circle>
      <circle cx="330" cy="226" r="160" stroke="#8b5cf6" stroke-opacity="0.22">
        <animateTransform attributeName="transform" type="rotate" from="0 330 226" to="360 330 226" dur="40s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="14" opacity="0.78">
      <text x="68" y="116">const developer = "Gyan";</text>
      <text x="68" y="138">while(learning) &#123;</text>
      <text x="88" y="160">keepGoing();</text>
      <text x="68" y="182">&#125;</text>
    </g>

    <text x="1180" y="48" text-anchor="end" fill="#c4b5fd" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="1">IDEAS → CODE → PROJECTS → BETTER ME</text>

    <text x="180" y="242" fill="#e6f3ff" font-family="'Segoe UI', Arial, sans-serif" font-size="96" font-weight="700" filter="url(#softGlow)">GYAN</text>
    <text x="182" y="286" fill="#67e8f9" font-family="'JetBrains Mono', monospace" font-size="24" letter-spacing="3">DEVELOPER • BUILDER • LEARNER</text>

    <text x="182" y="334" fill="#9edfff" font-family="'JetBrains Mono', monospace" font-size="18">&gt; initializing next build</text>
    <rect x="430" y="320" width="11" height="16" rx="2" fill="#9edfff">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <g fill="#89d9ff">
      <circle cx="160" cy="66" r="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="243" cy="74" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="483" cy="58" r="2"><animate attributeName="cy" values="58;63;58" dur="5.6s" repeatCount="indefinite"/></circle>
      <circle cx="1035" cy="165" r="1.8"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="1090" cy="92" r="1.6"><animate attributeName="cy" values="92;86;92" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="987" cy="235" r="2.1"><animate attributeName="cx" values="987;1000;987" dur="8s" repeatCount="indefinite"/></circle>
    </g>

    <rect x="-340" y="0" width="220" height="520" fill="url(#horizon)" opacity="0.13" transform="skewX(-24)">
      <animate attributeName="x" values="-340;1380" dur="11s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
